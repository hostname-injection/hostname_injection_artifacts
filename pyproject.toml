[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccd"
version = "0.1.0"
description = "Anonymous reference implementation of Contrastive Cone Divergence (CCD)."
requires-python = ">=3.9"
keywords = ["security", "hostname", "anomaly-detection", "contrastive-learning", "ccd"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.24",
  "sentence-transformers>=2.6",
  "torch>=2.1",
  "scipy>=1.10",
  "idna>=3.4",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4",
]

[project.scripts]
ccd = "ccd.cli:main"

[tool.setuptools]
packages = ["ccd"]
