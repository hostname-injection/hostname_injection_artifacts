[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccd"
version = "0.1.0"
description = "Anonymous reference implementation of Contrastive Cone Divergence (CCD)."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["security", "hostname", "anomaly-detection", "contrastive-learning", "ccd"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.24",
  "sentence-transformers>=2.6",
  "sentencepiece>=0.1.99",
  "torch>=2.1",
  "scipy>=1.10",
  "idna>=3.4",
  "GradCache @ git+https://github.com/luyug/GradCache.git",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4",
]
dev = [
  "pytest>=7.4",
  "sentencepiece>=0.1.99",
  "ruff>=0.4.0",
  "black>=24.0",
  "mypy>=1.6",
]

[project.scripts]
ccd = "ccd.cli:main"
ccd-diagnose = "ccd.entrypoints:diagnose_main"
ccd-explain = "ccd.entrypoints:explain_main"
ccd-score = "ccd.entrypoints:score_main"

[tool.setuptools]
packages = ["ccd"]
